

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: peace_rice_shop_app
    container_name: peace_rice_shop_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # environment:
    #   APP_ENV: production
    #   APP_DEBUG: "false"
    #   APP_URL: http://localhost:8000
    #   DB_CONNECTION: mysql
    #   DB_HOST: db
    #   DB_PORT: 3306
    #   DB_DATABASE: peace_rice_shop
    #   DB_USERNAME: root
    #   DB_PASSWORD: password
    #   REDIS_HOST: redis
    #   REDIS_PASSWORD: null
    #   REDIS_PORT: 6379
    networks:
      - peace_network

  web:
    image: nginx:stable-alpine
    container_name: peace_rice_shop_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # change "9000:80" for localhost access, or "80:80" for public access
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - peace_network

  db:
    image: mysql:8.1
    container_name: peace_rice_shop_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: peace_rice_shop
    # ports:
    #   - "3306:3306"
    # uncomment the above lines if you want to access MySQL from your host machine
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - peace_network

  redis:
    image: redis:alpine
    container_name: peace_rice_shop_redis
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
    # uncomment the above lines if you want to access Redis from your host machine
    volumes:
      - redis_data:/data
    networks:
      - peace_network

networks:
  peace_network:
    driver: bridge

volumes:
  db_data:
  redis_data: